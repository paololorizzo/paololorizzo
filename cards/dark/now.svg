<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" fill="none" role="img"><style>@font-face{font-family:JB;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:SG;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
.sg{font-family:SG,'Segoe UI',Helvetica,Arial,sans-serif}
.jb{font-family:JB,ui-monospace,SFMono-Regular,Menlo,monospace}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes flash{0%,100%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.up{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .6s ease-out both}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
.grow{animation:grow .8s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:bottom}
.draw{stroke-dasharray:1;animation:draw .9s ease-out both}
.ch{animation:fade .01s linear both}
.frame{opacity:0;animation:flash var(--d) steps(1) none}
.cursor{animation:blink 1s steps(1) 5 both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse{display:none}}</style><rect x=".5" y=".5" width="899" height="119" rx="14" fill="#0d1117" stroke="#30363d"/><g class="up" style="animation-delay:0.20s"><circle cx="36" cy="44" r="4" fill="#3fb950"/><text x="48" y="48" class="jb" font-size="12" font-weight="600" letter-spacing="1.5" fill="#9198a1">NOW BUILDING</text><text x="32" y="80" class="sg" font-size="16" font-weight="500" fill="#e6edf3">Apps with Supabase + Expo</text></g><line class="fade" style="animation-delay:0.35s" x1="299" y1="28" x2="299" y2="92" stroke="#21262d"/><g class="up" style="animation-delay:0.35s"><circle cx="315" cy="44" r="4" fill="#a78bfa"/><text x="327" y="48" class="jb" font-size="12" font-weight="600" letter-spacing="1.5" fill="#9198a1">NOW LEARNING</text><text x="311" y="80" class="sg" font-size="16" font-weight="500" fill="#e6edf3">AI agents in TypeScript</text></g><line class="fade" style="animation-delay:0.50s" x1="577" y1="28" x2="577" y2="92" stroke="#21262d"/><g class="up" style="animation-delay:0.50s"><circle cx="593" cy="44" r="4" fill="#f0b429"/><text x="605" y="48" class="jb" font-size="12" font-weight="600" letter-spacing="1.5" fill="#9198a1">NOW CONTRIBUTING</text><text x="589" y="80" class="sg" font-size="16" font-weight="500" fill="#e6edf3">Open source, ~4h a week</text></g></svg>